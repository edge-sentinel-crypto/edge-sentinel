# Project-wide Gradle settings.
# R8/minifyRelease needs a generous heap; too-small -Xmx causes GC thrashing OOM.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# AndroidX
android.useAndroidX=true

# Kotlin
kotlin.code.style=official

# KSP
ksp.incremental=true

# Enables namespacing of each library's R class
android.nonTransitiveRClass=true

# Disable build features not in use
android.defaults.buildfeatures.buildconfig=true
